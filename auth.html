<!DOCTYPE html>
<html lang="vi">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>SmartMoney - Đăng Nhập & Đăng Ký</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <link rel="stylesheet" href="css/style.css">
</head>
<body class="min-h-screen flex items-center justify-center p-4 bg-gradient-to-br from-emerald-900 via-slate-900 to-slate-950">
    <div class="bg-white/95 backdrop-blur-md w-full max-w-md rounded-2xl shadow-2xl p-8 border border-white/20">
        <div class="text-center mb-6">
            <div class="inline-flex items-center justify-center w-16 h-16 rounded-2xl bg-emerald-500 text-white text-3xl mb-3 shadow-lg shadow-emerald-500/30">
                <i class="fa-solid fa-wallet"></i>
            </div>
            <h1 class="text-2xl font-bold text-slate-800">SmartMoney</h1>
            <p class="text-sm text-slate-500 mt-1">Hệ thống quản lý chi tiêu cá nhân thông minh</p>
        </div>
        <div class="flex bg-slate-100 p-1 rounded-xl mb-6 font-medium text-sm">
            <button id="tab-btn-login" onclick="switchAuthTab('login')" class="flex-1 py-2.5 rounded-lg text-slate-700 bg-white shadow-sm font-semibold">Đăng Nhập</button>
            <button id="tab-btn-register" onclick="switchAuthTab('register')" class="flex-1 py-2.5 rounded-lg text-slate-500 hover:text-slate-800">Đăng Ký</button>
        </div>
        <form id="form-login" onsubmit="handleLogin(event)" class="space-y-4">
            <div>
                <label class="block text-xs font-semibold uppercase tracking-wider text-slate-600 mb-1.5">Tên đăng nhập hoặc Email</label>
                <input type="text" id="login-username" required placeholder="user@smartmoney.vn" class="w-full px-4 py-2.5 bg-slate-50 border border-slate-200 rounded-xl text-sm focus:outline-none focus:ring-2 focus:ring-emerald-500">
            </div>
            <div>
                <label class="block text-xs font-semibold uppercase tracking-wider text-slate-600 mb-1.5">Mật khẩu</label>
                <input type="password" id="login-password" required placeholder="Mật khẩu" class="w-full px-4 py-2.5 bg-slate-50 border border-slate-200 rounded-xl text-sm focus:outline-none focus:ring-2 focus:ring-emerald-500">
            </div>
            <div class="flex items-center justify-between text-xs text-slate-500">
                <label class="flex items-center gap-1.5 cursor-pointer"><input type="checkbox" checked class="rounded text-emerald-600"> Ghi nhớ đăng nhập</label>
                <a href="javascript:alert('Vui lòng liên hệ Admin để khôi phục mật khẩu!')" class="text-emerald-600 hover:underline font-semibold">Quên mật khẩu?</a>
            </div>
            <button type="submit" class="w-full py-3 bg-emerald-600 hover:bg-emerald-700 text-white font-semibold rounded-xl shadow-lg shadow-emerald-600/30 transition">Đăng Nhập Hệ Thống</button>
        </form>
        <form id="form-register" onsubmit="handleRegister(event)" class="space-y-3.5 hidden">
            <input type="text" id="reg-fullname" required placeholder="Họ và tên" class="w-full px-3.5 py-2 bg-slate-50 border border-slate-200 rounded-xl text-sm">
            <input type="text" id="reg-username" required placeholder="Tên đăng nhập" class="w-full px-3.5 py-2 bg-slate-50 border border-slate-200 rounded-xl text-sm">
            <input type="email" id="reg-email" required placeholder="Email" class="w-full px-3.5 py-2 bg-slate-50 border border-slate-200 rounded-xl text-sm">
            <div class="grid grid-cols-2 gap-2">
                <input type="password" id="reg-password" required placeholder="Mật khẩu" class="w-full px-3.5 py-2 bg-slate-50 border border-slate-200 rounded-xl text-sm">
                <input type="password" id="reg-confirm-password" required placeholder="Nhập lại mật khẩu" class="w-full px-3.5 py-2 bg-slate-50 border border-slate-200 rounded-xl text-sm">
            </div>
            <button type="submit" class="w-full py-3 mt-2 bg-emerald-600 hover:bg-emerald-700 text-white font-semibold rounded-xl">Đăng Ký Tài Khoản</button>
        </form>
        <div class="mt-6 pt-4 border-t border-slate-200 text-center">
            <p class="text-xs text-slate-400 mb-2 font-medium">Tài khoản dùng thử</p>
            <div class="flex gap-2">
                <button onclick="quickLogin('user')" class="flex-1 py-1.5 px-2 bg-slate-100 hover:bg-emerald-50 border border-slate-200 rounded-lg text-xs font-medium">Người dùng</button>
                <button onclick="quickLogin('admin')" class="flex-1 py-1.5 px-2 bg-slate-100 hover:bg-purple-50 border border-slate-200 rounded-lg text-xs font-medium">Quản trị</button>
            </div>
        </div>
        <a href="index.html" class="mt-5 block text-center text-sm font-semibold text-emerald-700">Về trang chủ SmartMoney</a>
    </div>
    <script src="js/auth.js"></script>
</body>
</html>
