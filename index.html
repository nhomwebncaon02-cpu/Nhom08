<!DOCTYPE html>
<html lang="vi">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>SmartMoney - Đăng Nhập & Đăng Ký</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <link rel="stylesheet" href="css/style.css">
</head>
<body class="min-h-screen flex items-center justify-center p-4 bg-gradient-to-br from-emerald-900 via-slate-900 to-slate-950">

    <div class="bg-white/95 backdrop-blur-md w-full max-w-md rounded-2xl shadow-2xl p-8 border border-white/20">
        <!-- Logo Header -->
        <div class="text-center mb-6">
            <div class="inline-flex items-center justify-center w-16 h-16 rounded-2xl bg-emerald-500 text-white text-3xl mb-3 shadow-lg shadow-emerald-500/30">
                <i class="fa-solid fa-wallet"></i>
            </div>
            <h1 class="text-2xl font-bold text-slate-800">SmartMoney</h1>
            <p class="text-sm text-slate-500 mt-1">Hệ thống quản lý chi tiêu cá nhân thông minh</p>
        </div>

        <!-- Tab Buttons -->
        <div class="flex bg-slate-100 p-1 rounded-xl mb-6 font-medium text-sm">
            <button id="tab-btn-login" onclick="switchAuthTab('login')" class="flex-1 py-2.5 rounded-lg text-slate-700 bg-white shadow-sm font-semibold">Đăng Nhập</button>
            <button id="tab-btn-register" onclick="switchAuthTab('register')" class="flex-1 py-2.5 rounded-lg text-slate-500 hover:text-slate-800">Đăng Ký</button>
        </div>

        <!-- Form Đăng Nhập -->
        <form id="form-login" onsubmit="handleLogin(event)" class="space-y-4">
            <div>
                <label class="block text-xs font-semibold uppercase tracking-wider text-slate-600 mb-1.5">Tên đăng nhập hoặc Email</label>
                <div class="relative">
                    <span class="absolute inset-y-0 left-0 flex items-center pl-3 text-slate-400"><i class="fa-regular fa-user"></i></span>
                    <input type="text" id="login-username" required placeholder="user@smartmoney.vn" class="w-full pl-10 pr-4 py-2.5 bg-slate-50 border border-slate-200 rounded-xl text-sm focus:outline-none focus:ring-2 focus:ring-emerald-500">
                </div>
            </div>
            <div>
                <label class="block text-xs font-semibold uppercase tracking-wider text-slate-600 mb-1.5">Mật khẩu</label>
                <div class="relative">
                    <span class="absolute inset-y-0 left-0 flex items-center pl-3 text-slate-400"><i class="fa-solid fa-lock"></i></span>
                    <input type="password" id="login-password" required placeholder="••••••••" class="w-full pl-10 pr-4 py-2.5 bg-slate-50 border border-slate-200 rounded-xl text-sm focus:outline-none focus:ring-2 focus:ring-emerald-500">
                </div>
            </div>
            <div class="flex items-center justify-between text-xs text-slate-500">
                <label class="flex items-center gap-1.5 cursor-pointer">
                    <input type="checkbox" checked class="rounded text-emerald-600"> Ghi nhớ đăng nhập
                </label>
                <a href="javascript:alert('Vui lòng liên hệ Admin để khôi phục mật khẩu!')" class="text-emerald-600 hover:underline font-semibold">Quên mật khẩu?</a>
            </div>
            <button type="submit" class="w-full py-3 bg-emerald-600 hover:bg-emerald-700 text-white font-semibold rounded-xl shadow-lg shadow-emerald-600/30 transition flex items-center justify-center gap-2">
                <i class="fa-solid fa-arrow-right-to-bracket"></i> Đăng Nhập Hệ Thống
            </button>
        </form>

        <!-- Form Đăng Ký -->
        <form id="form-register" onsubmit="handleRegister(event)" class="space-y-3.5 hidden">
            <div>
                <label class="block text-xs font-semibold uppercase tracking-wider text-slate-600 mb-1">Họ và Tên</label>
                <input type="text" id="reg-fullname" required placeholder="Nguyễn Văn A" class="w-full px-3.5 py-2 bg-slate-50 border border-slate-200 rounded-xl text-sm focus:outline-none focus:ring-2 focus:ring-emerald-500">
            </div>
            <div>
                <label class="block text-xs font-semibold uppercase tracking-wider text-slate-600 mb-1">Tên đăng nhập</label>
                <input type="text" id="reg-username" required placeholder="nguyenvana" class="w-full px-3.5 py-2 bg-slate-50 border border-slate-200 rounded-xl text-sm focus:outline-none focus:ring-2 focus:ring-emerald-500">
            </div>
            <div>
                <label class="block text-xs font-semibold uppercase tracking-wider text-slate-600 mb-1">Email</label>
                <input type="email" id="reg-email" required placeholder="vana@smartmoney.vn" class="w-full px-3.5 py-2 bg-slate-50 border border-slate-200 rounded-xl text-sm focus:outline-none focus:ring-2 focus:ring-emerald-500">
            </div>
            <div class="grid grid-cols-2 gap-2">
                <div>
                    <label class="block text-xs font-semibold uppercase tracking-wider text-slate-600 mb-1">Mật khẩu</label>
                    <input type="password" id="reg-password" required placeholder="••••••••" class="w-full px-3.5 py-2 bg-slate-50 border border-slate-200 rounded-xl text-sm">
                </div>
                <div>
                    <label class="block text-xs font-semibold uppercase tracking-wider text-slate-600 mb-1">Nhập lại</label>
                    <input type="password" id="reg-confirm-password" required placeholder="••••••••" class="w-full px-3.5 py-2 bg-slate-50 border border-slate-200 rounded-xl text-sm">
                </div>
            </div>
            <button type="submit" class="w-full py-3 mt-2 bg-emerald-600 hover:bg-emerald-700 text-white font-semibold rounded-xl shadow-lg shadow-emerald-600/30 transition flex items-center justify-center gap-2">
                <i class="fa-solid fa-user-plus"></i> Đăng Ký Tài Khoản
            </button>
        </form>

        <!-- Nút Test nhanh -->
        <div class="mt-6 pt-4 border-t border-slate-200 text-center">
            <p class="text-xs text-slate-400 mb-2 font-medium">⚡ Chọn tài khoản test nhanh:</p>
            <div class="flex gap-2">
                <button onclick="quickLogin('user')" class="flex-1 py-1.5 px-2 bg-slate-100 hover:bg-emerald-50 hover:text-emerald-700 border border-slate-200 rounded-lg text-xs font-medium text-slate-600 transition flex items-center justify-center gap-1">
                    <i class="fa-solid fa-user"></i> Người dùng (User)
                </button>
                <button onclick="quickLogin('admin')" class="flex-1 py-1.5 px-2 bg-slate-100 hover:bg-purple-50 hover:text-purple-700 border border-slate-200 rounded-lg text-xs font-medium text-slate-600 transition flex items-center justify-center gap-1">
                    <i class="fa-solid fa-user-shield"></i> Quản trị (Admin)
                </button>
            </div>
        </div>
    </div>

    <script src="js/auth.js"></script>
</body>
</html>
